# fly.toml app configuration file generated for ikvmcraft on 2026-05-19T05:05:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ikvmcraft'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[services]]
  protocol = ''
  internal_port = 8080

  [[services.ports]]
    port = 80

  [services.concurrency]
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
